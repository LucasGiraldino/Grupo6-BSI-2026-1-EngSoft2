spring.application.name=sigaac

# Database
spring.datasource.url=jdbc:postgresql://localhost:5433/sigaac
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
server.servlet.context-path=/

# REST API base path
spring.data.rest.base-path=/api

# React frontend (for production)
# The built React files will be served from /Users/lucasgiraldino/estudos/Grupo6-BSI-2026-1-EngSoft2/frontend/dist

# JWT Security (leia do .env — nunca commite o valor real aqui)
api.security.token.secret=${JWT_SECRET:dev-only-insecure-secret-mude-em-producao}

# Mail Configuration
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# CPF Hub API (optional - get free token at https://cpfhub.io)
api.cpf.token=
