spring.application.name=sigaac

# Database
spring.datasource.url=jdbc:postgresql://localhost:5434/sigaac
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
server.servlet.context-path=/

# REST API base path
spring.data.rest.base-path=/api

# React frontend (for production)
# The built React files will be served from ./Grupo6-BSI-2026-1-EngSoft2/frontend/dist

# JWT Security (leia do .env — nunca commite o valor real aqui)
api.security.token.secret=${JWT_SECRET:dev-only-insecure-secret-mude-em-producao}


# Seed data (dev only - set to true to populate DB on startup)
app.seed-data=false

# CPF Hub API (optional - get free token at https://cpfhub.io)
# Deixe vazio para usar modo simulado (dados gerados a partir do CPF)
api.cpf.token=
