<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGAAC - Redirecionando...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                },
            },
        }
    </script>
</head>
<body class="font-sans bg-gray-100 min-h-screen flex items-center justify-center">

    <!-- Loading state -->
    <div id="loading" class="flex flex-col items-center gap-4">
        <div class="w-10 h-10 border-4 border-[#d4a017] border-t-transparent rounded-full animate-spin"></div>
        <p class="text-gray-600 font-medium">Verificando permissões...</p>
    </div>

    <!-- User selection (dev only - remove when login is implemented) -->
    <div id="dev-login" class="hidden w-full max-w-md px-6">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-gray-900">SIGAAC</h1>
                <p class="text-sm text-gray-500 mt-1">Selecione um usuário para teste</p>
            </div>

            <div class="flex flex-col gap-3">
                <button onclick="selectUser('admin@sigaac.com')" class="w-full bg-[#1a1a1a] text-white px-4 py-3 rounded-lg font-semibold hover:bg-black transition-colors text-sm">
                    Entrar como Administrador
                </button>
                <button onclick="selectUser('user@sigaac.com')" class="w-full border border-gray-300 text-gray-700 px-4 py-3 rounded-lg font-semibold hover:bg-gray-50 transition-colors text-sm">
                    Entrar como Usuário Comum
                </button>
            </div>
        </div>
    </div>

    <script>
        async function checkAndRedirect() {
            const userEmail = localStorage.getItem('userEmail');

            if (!userEmail) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('dev-login').classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch(`/api/parametrizacao/configuracao-sistema?email=${encodeURIComponent(userEmail)}`);
                const config = await response.json();

                if (config.usuarioEhAdministrador) {
                    window.location.href = '/dashboard.html';
                } else {
                    window.location.href = '/pacientes.html';
                }
            } catch (error) {
                console.error('Erro ao verificar permissões:', error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('dev-login').classList.remove('hidden');
            }
        }

        function selectUser(email) {
            localStorage.setItem('userEmail', email);
            checkAndRedirect();
        }

        document.addEventListener('DOMContentLoaded', checkAndRedirect);
    </script>
</body>
</html>
